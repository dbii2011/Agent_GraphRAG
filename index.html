<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ariane Cœur</title>
<style>
  :root {
    --bleu-fonce: #1F4E79;
    --bleu-clair: #2E74B5;
    --fond: #F4F6F8;
    --carte: #FFFFFF;
    --texte: #1C2733;
    --texte-att: #5B6B7A;
    --erreur-bg: #FDECEC;
    --erreur-bord: #C0392B;
    --erreur-texte: #922B21;
    --bordure: #E1E6EB;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Segoe UI", Calibri, Roboto, sans-serif;
    background: var(--fond);
    color: var(--texte);
    height: 100vh;
    display: flex;
  }

  /* --- Barre laterale : historique des conversations --- */
  #sidebar {
    width: 280px;
    flex-shrink: 0;
    background: var(--carte);
    border-right: 1px solid var(--bordure);
    display: flex;
    flex-direction: column;
  }

  #sidebar-header {
    padding: 20px 16px;
    border-bottom: 1px solid var(--bordure);
  }

  #nouvelle-conv {
    width: 100%;
    padding: 10px 12px;
    background: var(--bleu-fonce);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #nouvelle-conv:hover { background: var(--bleu-clair); }

  #liste-conversations {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .conv-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 4px;
    font-size: 14px;
    color: var(--texte);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .conv-item:hover { background: var(--fond); }
  .conv-item.active { background: #E8F0F8; color: var(--bleu-fonce); font-weight: 600; }

  .conv-titre {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .conv-suppr {
    background: none;
    border: none;
    color: var(--texte-att);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 6px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .conv-suppr:hover { background: var(--erreur-bg); color: var(--erreur-bord); }

  #vide-historique {
    padding: 16px 12px;
    color: var(--texte-att);
    font-size: 13px;
    text-align: center;
  }

  /* --- Zone principale --- */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  #header {
    background: var(--bleu-fonce);
    color: white;
    padding: 28px 24px;
    text-align: center;
  }
  #header h1 { margin: 0 0 6px 0; font-size: 26px; }
  #header p { margin: 0; opacity: 0.85; font-size: 14px; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  #messages:empty::before {
    content: "Pose ta première question sur le graphe Ariane pour démarrer une conversation.";
    display: block;
    text-align: center;
    color: var(--texte-att);
    margin-top: 40px;
    font-size: 14px;
  }

  .msg {
    max-width: 70%;
    padding: 14px 18px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
  }

  .msg.utilisateur {
    align-self: flex-end;
    background: var(--bleu-fonce);
    color: white;
    border-bottom-right-radius: 4px;
  }

  .msg.assistant {
    align-self: flex-start;
    background: var(--carte);
    border: 1px solid var(--bordure);
    border-bottom-left-radius: 4px;
  }

  .msg.erreur {
    align-self: stretch;
    max-width: 100%;
    background: var(--erreur-bg);
    border: 1px solid var(--erreur-bord);
    color: var(--erreur-texte);
  }

  .msg.chargement {
    align-self: flex-start;
    background: var(--carte);
    border: 1px solid var(--bordure);
    color: var(--texte-att);
    font-style: italic;
  }

  #zone-saisie {
    display: flex;
    gap: 12px;
    padding: 20px 24px;
    border-top: 1px solid var(--bordure);
    background: var(--carte);
  }

  #question {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid var(--bordure);
    border-radius: 10px;
    font-size: 14px;
    outline: none;
  }
  #question:focus { border-color: var(--bleu-clair); }

  #envoyer {
    padding: 12px 24px;
    background: var(--bleu-fonce);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #envoyer:hover { background: var(--bleu-clair); }
  #envoyer:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

  <div id="sidebar">
    <div id="sidebar-header">
      <button id="nouvelle-conv">+ Nouvelle conversation</button>
    </div>
    <div id="liste-conversations"></div>
  </div>

  <div id="main">
    <div id="header">
      <h1>Ariane Cœur</h1>
      <p>Assistant du graphe de connaissances Ariane</p>
    </div>

    <div id="messages"></div>

    <div id="zone-saisie">
      <input type="text" id="question" placeholder="Pose ta question sur le graphe Ariane..." autocomplete="off">
      <button id="envoyer">Envoyer</button>
    </div>
  </div>

<script>
  let conversationId = null;

  const elMessages = document.getElementById("messages");
  const elListeConv = document.getElementById("liste-conversations");
  const elQuestion = document.getElementById("question");
  const elEnvoyer = document.getElementById("envoyer");

  function ajouterMessage(role, contenu) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = contenu;
    elMessages.appendChild(div);
    elMessages.scrollTop = elMessages.scrollHeight;
    return div;
  }

  async function chargerConversations() {
    const res = await fetch("/conversations");
    const conversations = await res.json();

    elListeConv.innerHTML = "";

    if (conversations.length === 0) {
      elListeConv.innerHTML = '<div id="vide-historique">Aucune conversation pour l\'instant</div>';
      return;
    }

    for (const conv of conversations) {
      const item = document.createElement("div");
      item.className = "conv-item" + (conv.id === conversationId ? " active" : "");

      const titre = document.createElement("span");
      titre.className = "conv-titre";
      titre.textContent = conv.titre;
      titre.onclick = () => ouvrirConversation(conv.id);

      const suppr = document.createElement("button");
      suppr.className = "conv-suppr";
      suppr.textContent = "✕";
      suppr.title = "Supprimer";
      suppr.onclick = async (e) => {
        e.stopPropagation();
        await fetch("/conversations/" + conv.id, { method: "DELETE" });
        if (conv.id === conversationId) nouvelleConversation();
        chargerConversations();
      };

      item.appendChild(titre);
      item.appendChild(suppr);
      item.onclick = () => ouvrirConversation(conv.id);
      elListeConv.appendChild(item);
    }
  }

  async function ouvrirConversation(id) {
    conversationId = uuid.UUID(id);
    elMessages.innerHTML = "";

    const res = await fetch("/conversations/" + id + "/messages");
    if (!res.ok) return;

    const messages = await res.json();
    for (const m of messages) {
      ajouterMessage(m.role, m.contenu);
    }
    chargerConversations();
  }

  function nouvelleConversation() {
    conversationId = uuid.UUID(null);
    elMessages.innerHTML = "";
    chargerConversations();
    elQuestion.focus();
  }

  async function envoyerQuestion() {
    const question = elQuestion.value.trim();
    if (!question) return;

    elQuestion.value = "";
    elEnvoyer.disabled = true;

    ajouterMessage("utilisateur", question);
    const elChargement = ajouterMessage("chargement", "Recherche dans le graphe...");

    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, conversation_id: conversationId }),
      });

      const data = await res.json();
      elChargement.remove();

      if (!res.ok) {
        ajouterMessage("erreur", "Erreur : " + (data.detail || "erreur inconnue"));
        return;
      }

      conversationId = data.conversation_id;
      ajouterMessage("assistant", data.reponse);
      chargerConversations();
    } catch (err) {
      elChargement.remove();
      ajouterMessage("erreur", "Erreur réseau : impossible de contacter le serveur.");
    } finally {
      elEnvoyer.disabled = false;
      elQuestion.focus();
    }
  }

  elEnvoyer.onclick = envoyerQuestion;
  elQuestion.addEventListener("keydown", (e) => {
    if (e.key === "Enter") envoyerQuestion();
  });
  document.getElementById("nouvelle-conv").onclick = nouvelleConversation;

  chargerConversations();
</script>
</body>
</html>
